    <style>
        .text-white {
            color: white !important;
        }

        .btn-audio-toggle {
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .music-status {
            display: flex;
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            z-index: 9999;
            align-items: center;
            font-family: sans-serif;
            font-size: 14px;
        }

        .music-status .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #a259f7;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        body.portrait-mode #landscape-warning {
            display: flex;
            opacity: 1;
        }
    </style>
</head>

<body>

</div>

    <script>
        window.dataLove2Loveloom = {

                ringTexts: ["VIC PERSI"],
            }

    <script type="module" src="./script.js"></script>

    <!-- Khởi tạo Music Manager -->
    <script>
    window.musicManager = {
        audio: null,
        isPlaying: false,

        init() {
            this.audio = new Audio('Good.mp3');
            this.audio.loop = true;
            this.audio.volume = 0.7;
            this.audio.preload = "auto";

            this.audio.onplay = () => {
                this.isPlaying = true;
                this.updateUI();
            };

            this.audio.onpause = () => {
                this.isPlaying = false;
                this.updateUI();
            };

            this.updateUI();
        },

        play() {
            if (!this.audio) return Promise.reject('Audio no inicializado');
            return this.audio.play().catch(e => {
                console.warn('Error al reproducir música:', e);
                throw e;
            });
        },

        togglePlayback() {
            if (!this.audio) return;
            if (this.audio.paused) {
                this.audio.play().catch(e => {
                    console.warn('Error al reproducir música:', e);
                });
            } else {
                this.audio.pause();
            }
        },

        updateUI() {
            const icon = document.getElementById('audio-icon');
            if (!icon) return;
            if (this.isPlaying) {
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
            } else {
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
            }
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        window.musicManager.init();
        const toggleButton = document.getElementById('toggle-audio');
        if (toggleButton) {
            toggleButton.addEventListener('click', () => {
                window.musicManager.togglePlayback();
            });
        } else {
            console.warn('Botón toggle-audio no encontrado');
        }
    });
</script>
</body>

</html>
